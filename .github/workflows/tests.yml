name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m compileall -q __init__.py core.py tools/convert.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify sample CLI conversion
        run: python tools/convert.py examples/layout_1000.json --width 1248 --height 1680 -o /tmp/moss_native.json
